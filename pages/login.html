  <link rel="stylesheet" href="../css/ropa.css">
</head>
<body>
  <header class="header">
  <a href="../index.html" class="logo">
    <span class="logo-yami">&lt;YAMI</span><span class="logo-code">CODE&gt;</span>
  </a>
  
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="nav" id="nav">
    <div class="nav-title">SISTEMA</div>
    <a href="../index.html">Inicio</a>
    <a href="aula.html">Desarrollo Web</a>
    <a href="apps.html">Creación de Aplicaciones</a>

    <div class="nav-title">HERRAMIENTAS</div>
    <a href="../index.html#descargas">Descargas</a>
    <a href="../index.html#reportes">Reportes</a>

    <div class="nav-divider"></div>
    
    <a href="login.html" class="btn-nav" style="text-align: center; margin-top: 10px; border: 1px solid var(--cian); padding: 8px; border-radius: 6px; color: var(--cian) !important;">Iniciar Sesión</a>
  </nav>
</header>

  <main>
    <div class="login-container">
      <h2 class="page-title" style="font-size: 1.5rem;" id="formTitle">Iniciar <span class="neon">Sesión</span></h2>
      <p class="section-sub" style="margin-bottom: 2rem;" id="formSub">Bienvenido de vuelta, hacker.</p>

      <form id="authForm">
        <div class="form-group" id="groupName" style="display: none;">
          <label for="name">Nombre de usuario</label>
          <input type="text" id="name" placeholder="Ej: Zalgert" minlength="3">
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group" id="groupConfirm" style="display: none;">
          <label for="confirmPassword">Listo</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Entrar al Sistema</button>
      </form>

      <div id="mensaje" class="mensaje"></div>
      <div style="margin: 1.5rem 0; border-bottom: 1px solid var(--texto-dim); position: relative;">
        <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #12121f; padding: 0 10px; color: var(--texto-dim); font-size: 0.8rem;">O</span>
      </div>
      <button id="btnGoogle" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
        Entrar con Google
      </button>
      <p class="toggle-text" id="toggleTextContainer">¿No tienes cuenta? <span id="toggleMode">Regístrate aquí</span></p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-logo"><span class="logo-yami">&lt;YAMI</span><span class="logo-code">CODE&gt;</span></div>
  </footer>

  <script src="../js/cerebro.js"></script>
  <script type="module" src="../js/sys_login.js"></script>
</body>
</html>
