<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - &lt;YamiCode&gt;</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/ropa.css">
  <style>
    .login-container { max-width: 400px; margin: 100px auto; padding: 2rem; background: rgba(26, 26, 46, 0.6); border: 1px solid var(--cian); border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0, 245, 255, 0.1); text-align: center; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; color: var(--cian); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; padding: 0.8rem; background: #000; border: 1px solid var(--texto-dim); color: var(--texto); border-radius: 8px; outline: none; font-family: 'Rajdhani', sans-serif; font-size: 1rem; }
    .form-group input:focus { border-color: var(--cian); }
    .btn-google { background: #fff; color: #333; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 1rem; font-weight: bold; border: none; padding: 0.8rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .btn-google:hover { background: #ddd; }
    .toggle-text { margin-top: 1.5rem; color: var(--texto-dim); font-size: 0.9rem; }
    .toggle-text span { color: var(--magenta); cursor: pointer; font-weight: bold; }
    .mensaje { display: none; padding: 1rem; border-radius: 8px; margin-top: 1rem; font-weight: bold; font-size: 0.9rem; }
    .error { display: block; background: rgba(255, 46, 151, 0.1); color: var(--magenta); border: 1px solid var(--magenta); }
    .exito { display: block; background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff88; }
  </style>
</head>
<body>
  <header class="header">
    <a href="../index.html" class="logo"><span class="logo-yami">&lt;YAMI</span><span class="logo-code">CODE&gt;</span></a>
    <nav class="nav" id="nav">
      <a href="../index.html">Inicio</a>
      <a href="aula.html">Aulas</a>
      <a href="labs.html">Especialidades</a>
      <a href="juegos.html">Juegos</a>
      <a href="login.html" class="btn-nav active">Entrar</a>
    </nav>
    <button class="menu-toggle" id="menuToggle">[=]</button>
  </header>

  <main>
    <div class="login-container">
      <h2 class="page-title" style="font-size: 1.5rem;">Acceso al <span class="neon">Núcleo</span></h2>
      <p class="section-sub" style="margin-bottom: 2rem;">Identifícate para guardar tu progreso.</p>

      <!-- Formulario -->
      <form id="authForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        
        <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
      </form>

      <div id="mensaje" class="mensaje"></div>

      <div style="margin: 1.5rem 0; border-bottom: 1px solid var(--texto-dim); position: relative;">
        <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #12121f; padding: 0 10px; color: var(--texto-dim); font-size: 0.8rem;">O</span>
      </div>

      <button id="btnGoogle" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
        Continuar con Google
      </button>

      <p class="toggle-text">
        ¿No tienes cuenta? <span id="toggleMode">Regístrate aquí</span>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-logo"><span class="logo-yami">YAMI</span><span class="logo-code">CODE</span></div>
  </footer>

  <script src="../js/cerebro.js"></script>
  
  <!-- Lógica del Login con Firebase -->
  <script type="module">
    import { auth } from "../js/firebase.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    let isLogin = true; // Estado inicial: Iniciar Sesión
    const form = document.getElementById('authForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const toggleMode = document.getElementById('toggleMode');
    const mensaje = document.getElementById('mensaje');
    const btnGoogle = document.getElementById('btnGoogle');

    // 1. Cambiar entre Iniciar Sesión y Registrarse
    toggleMode.addEventListener('click', () => {
      isLogin = !isLogin;
      btnSubmit.textContent = isLogin ? "Iniciar Sesión" : "Crear Cuenta";
      toggleMode.textContent = isLogin ? "Regístrate aquí" : "Inicia sesión aquí";
      document.querySelector('.toggle-text').innerHTML = isLogin 
        ? '¿No tienes cuenta? <span id="toggleMode">Regístrate aquí</span>' 
        : '¿Ya tienes cuenta? <span id="toggleMode">Inicia sesión aquí</span>';
      
      // Re-asignar el evento porque cambiamos el HTML interno
      document.getElementById('toggleMode').addEventListener('click', arguments.callee);
      mensaje.className = "mensaje";
    });

    // 2. Lógica del formulario (Correo/Contraseña)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      btnSubmit.textContent = "Cargando...";
      btnSubmit.disabled = true;

      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, email, password);
          mostrarMensaje("¡Acceso concedido! Redirigiendo...", "exito");
          setTimeout(() => window.location.href = "perfil.html", 1500);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          mostrarMensaje("¡Cuenta creada con éxito! Redirigiendo...", "exito");
          setTimeout(() => window.location.href = "perfil.html", 1500);
        }
      } catch (error) {
        let msj = "Error: Revisa tus datos.";
        if (error.code === 'auth/invalid-credential') msj = "Correo o contraseña incorrectos.";
        if (error.code === 'auth/email-already-in-use') msj = "Este correo ya está registrado.";
        if (error.code === 'auth/weak-password') msj = "La contraseña debe tener al menos 6 caracteres.";
        
        mostrarMensaje(msj, "error");
        btnSubmit.textContent = isLogin ? "Iniciar Sesión" : "Crear Cuenta";
        btnSubmit.disabled = false;
      }
    });

    // 3. Lógica de Google
    btnGoogle.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        mostrarMensaje("¡Acceso con Google concedido!", "exito");
        setTimeout(() => window.location.href = "perfil.html", 1500);
      } catch (error) {
        mostrarMensaje("Error al conectar con Google.", "error");
      }
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = `mensaje ${tipo}`;
    }
  </script>
</body>
</html>
