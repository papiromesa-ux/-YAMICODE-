<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> SOPORTE DE ALEXANDER- &lt;YamiCode&gt;</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ropa.css">
  <style>
    .error-panel { max-width: 700px; margin: 0 auto; text-align: center; padding: 2rem; }
    .error-code-box { background: #000; border: 1px solid var(--magenta); padding: 1rem; border-radius: 8px; margin: 1.5rem 0; font-family: monospace; color: #00ff88; text-align: left; word-break: break-all; box-shadow: 0 0 15px rgba(255, 46, 151, 0.2); }
    .error-cat { font-size: 0.8rem; color: var(--texto-dim); display: block; margin-bottom: 0.5rem; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main class="hero" style="grid-template-columns: 1fr; justify-items: center; min-height: 100vh; align-content: center;">
    <div class="error-panel">
      
      <h1 class="hero-title" id="errorCode" style="font-size: 6rem; line-height: 1; color: var(--magenta); text-shadow: 0 0 20px var(--magenta); margin: 0;">ERR</h1>
      
      <h2 class="section-title" id="errorTitle" style="color: var(--texto); margin-top: 1rem;"> ALEXANDER DETECTO UN ERROR </h2>
      
      <div class="error-code-box" id="errorCodeBox">
        <span class="error-cat"> DIAGNÓSTICO ALEXANDER DE TU ERROR:</span>
        <span id="errorDesc"> ALEXANDER ESTA INVESTIGANDO TU ERROR...</span>
      </div>

      <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">RECARGA</a>
    </div>
  </main>
  <script src="js/sys_404.js"></script>
</body>
</html>
